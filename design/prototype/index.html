<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Social · Protótipo de interface</title>
<!-- Protótipo estático (sem backend) das primeiras telas. Tokens = docs/DESIGN_SYSTEM.md -->
<link rel="icon" type="image/svg+xml" href="../brand/orange-social-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webfonts" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: tema escuro (padrão) ---------- */
  .phone, :root {
    --bg: #17120D;            /* primitive.charcoal.900 */
    --surface: #211A12;
    --surface-2: #2B2217;
    --line: #3A3024;
    --line-soft: #2E2619;
    --text: #F6EFE5;
    --text-2: #BDAE97;
    --text-3: #8C7E69;

    --brand: #FF6A2B;          /* action.primary.bg */
    --brand-text: #FF9D5E;     /* orange para texto sobre escuro */
    --on-brand: #17120D;       /* 6,51:1 — branco reprova */

    --c-verde: #3DDC6B;  --c-amarelo: #F7C948;  --c-azul: #4A93FF;
    --c-laranja: #FF9F1C; --c-vermelho: #FF4D4D; --c-preto: #0C0A07;
    --preto-ring: #D6D0C8;     /* obrigatório no escuro: PRETO sem anel = 1,06:1 */
    --glyph-on-dot: #17120D;

    --r-livre: #1E7A3A; --r-12: #8B6B00; --r-16: #A85200; --r-18: #C5221F; --r-sens: #5B5148;
  }
  .phone.light {
    --bg: #FFFFFF;
    --surface: #F7F3EE;
    --surface-2: #EFE8DF;
    --line: #DDD3C6;
    --line-soft: #EAE2D7;
    --text: #1C1712;
    --text-2: #5A4E40;
    --text-3: #7A6C5B;
    --brand-text: #C2410C;     /* 5,18:1 sobre branco */
    --c-verde: #1E7A3A;  --c-amarelo: #8B6B00;  --c-azul: #1D5FCC;
    --c-laranja: #A85200; --c-vermelho: #C5221F; --c-preto: #0C0A07;
    --preto-ring: transparent;
    --glyph-on-dot: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0B0906;
    color: #F6EFE5;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 32px 64px;
  }
  .gallery-head { max-width: 1760px; margin: 0 auto 28px; display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .gallery-head h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
  .gallery-head h1 span { color: #FF6A2B; }
  .gallery-head .head-logo { width: 88px; height: 88px; flex: none; }
  .gallery-head > div { display: flex; align-items: center; gap: 20px; }
  .brand-panel { width: 390px; border-radius: 28px; background: #17120D; border: 1px solid #2B2217; padding: 26px; color: #F6EFE5; }
  .brand-panel h4 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; }
  .brand-panel p { color: #BDAE97; font-size: 13px; line-height: 1.5; margin: 6px 0 18px; }
  .brand-panel .hero { display: block; width: 260px; height: 260px; margin: 0 auto 20px; }
  .brand-panel .sizes { display: flex; align-items: end; gap: 18px; padding: 16px; border-radius: 16px; background: #0B0906; }
  .brand-panel .sizes figure { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 10px; color: #8C7E69; }
  .brand-panel .swatches { display: flex; gap: 6px; margin-top: 16px; }
  .brand-panel .swatches i { flex: 1; height: 10px; border-radius: 99px; }
  .gallery-head p { color: #BDAE97; font-size: 14px; margin-top: 6px; max-width: 70ch; }
  .gallery { max-width: 1760px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, 390px); gap: 36px 28px; justify-content: center; }
  .shot-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8C7E69; margin-bottom: 10px; }

  /* ---------- aparelho ---------- */
  .phone {
    width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text);
    box-shadow: 0 0 0 10px #000, 0 0 0 11px #2B2217, 0 30px 80px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .statusbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0 32px; font-size: 15px; font-weight: 600; }
  .statusbar .sys { display: flex; gap: 6px; align-items: center; }
  .statusbar .sys i { display: block; background: var(--text); border-radius: 2px; }

  .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 10px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  /* logo principal em design/brand/; abaixo de 48 px usa-se só a laranja (mark) — DESIGN_SYSTEM.md §8 */
  .logo { height: 32px; width: auto; display: block; }
  .brand b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  .brand b em { font-style: normal; color: var(--brand-text); }
  .top-actions { display: flex; gap: 6px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--text); background: var(--surface); border: 1px solid var(--line-soft); position: relative; }
  .icon-btn .badge { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--surface); }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 14px; height: 14px; }
  svg.i.xs { width: 12px; height: 12px; }

  /* Segmented Switcher — 4 feeds */
  .switcher { flex: none; margin: 0 16px; padding: 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; }
  .seg { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .seg[aria-selected="true"] { background: var(--brand); color: var(--on-brand); }

  /* Barra de filtros — 6 eixos */
  .filters { flex: none; display: flex; gap: 7px; padding: 12px 16px 10px; overflow: hidden; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .chip.on { border-color: var(--brand); color: var(--brand-text); background: color-mix(in srgb, var(--brand) 12%, transparent); }
  .chip .dots { display: inline-flex; gap: 2px; }
  .chip .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }

  .feed { flex: 1; overflow: hidden; padding: 2px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .section-title { display: flex; align-items: center; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); padding: 2px 2px 0; }

  /* Feed Card: bolinha (quem) + borda (cor da categoria) + chip (para quem) */
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-left: 3px solid var(--cc); border-radius: 14px; padding: 13px 14px 11px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .author { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .who { min-width: 0; line-height: 1.2; }
  .who b { font-size: 13.5px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 11.5px; color: var(--text-3); }
  .meta { display: flex; align-items: center; gap: 6px; flex: none; }
  .type { display: inline-flex; align-items: center; gap: 4px; font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; color: var(--text-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .rating { font-family: 'Space Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--rc); border-radius: 6px; padding: 3px 6px; }
  .c-title { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 17px; line-height: 1.22; letter-spacing: -.005em; margin-top: 10px; }
  .c-sub { font-size: 13px; color: var(--text-2); margin-top: 5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .media { margin-top: 10px; height: 150px; border-radius: 11px; position: relative; overflow: hidden; border: 1px solid var(--line-soft); }
  .media .play { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(23,18,13,.72); display: grid; place-items: center; color: #fff; }
  .media .dur { position: absolute; right: 8px; bottom: 8px; font-family: 'Space Mono', monospace; font-size: 10px; color: #fff; background: rgba(23,18,13,.72); padding: 2px 6px; border-radius: 5px; }
  .sponsored { font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: .1em; color: var(--text-3); text-transform: uppercase; margin-top: 8px; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--line); color: var(--text-3); font-size: 12px; }
  .actions span { display: inline-flex; align-items: center; gap: 5px; }
  .trend { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; color: var(--brand-text); }
  .trend.flat { color: var(--text-3); }

  /* Bolinha de categoria com glifo VSL */
  .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--dc); display: grid; place-items: center; flex: none; color: var(--glyph-on-dot); }
  .dot.lg { width: 30px; height: 30px; }
  .dot.preto { color: #F6EFE5; box-shadow: 0 0 0 2px var(--preto-ring); }
  .phone.light .dot.preto { color: #FFFFFF; }
  .dot svg { width: 13px; height: 13px; }
  .dot.lg svg { width: 16px; height: 16px; }

  /* Áudio */
  .now-playing { display: flex; align-items: center; gap: 12px; background: linear-gradient(120deg, color-mix(in srgb, var(--brand) 22%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 35%, var(--line)); border-radius: 16px; padding: 12px 14px; }
  .np-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex: none; }
  .np-info { flex: 1; min-width: 0; }
  .np-info small { font-family: 'Space Mono', monospace; font-size: 9.5px; letter-spacing: .14em; color: var(--brand-text); text-transform: uppercase; }
  .np-info b { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .progress { height: 4px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 38%; background: var(--brand); }
  .wave { display: flex; align-items: center; gap: 2px; height: 38px; margin-top: 10px; }
  .wave i { flex: 1; border-radius: 2px; background: var(--cc); opacity: .9; }
  .wave i.after { opacity: .3; }
  .audio-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .play-sm { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 20%, transparent); color: var(--text); flex: none; }
  .audio-row .time { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-2); }

  /* Alert Feed */
  .hazard { height: 6px; border-radius: 99px; background-image: repeating-linear-gradient(45deg, var(--brand) 0 12px, transparent 12px 24px); opacity: .9; flex: none; margin: 10px 16px 0; }
  .alert-card { background: linear-gradient(180deg, color-mix(in srgb, var(--c-vermelho) 12%, var(--surface)), var(--surface)); }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c-vermelho); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-top: 10px; font-size: 12px; }
  .kv dt { color: var(--text-3); }
  .kv dd { color: var(--text); font-weight: 500; }
  .verified { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--c-verde); }
  .map { margin-top: 10px; height: 74px; border-radius: 10px; border: 1px solid var(--line-soft); position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 58% 52%, color-mix(in srgb, var(--c-vermelho) 45%, transparent) 0 24px, color-mix(in srgb, var(--c-vermelho) 18%, transparent) 25px 46px, transparent 47px),
      repeating-linear-gradient(0deg, transparent 0 18px, var(--line-soft) 18px 19px),
      repeating-linear-gradient(90deg, transparent 0 18px, var(--line-soft) 18px 19px),
      var(--bg); }
  .map .pin { position: absolute; left: 58%; top: 52%; transform: translate(-50%, -100%); color: var(--c-vermelho); }
  .note { font-size: 11.5px; color: var(--text-3); display: flex; gap: 6px; align-items: flex-start; padding: 0 2px; line-height: 1.4; }

  /* Profile Feed */
  .pcard { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .avatar { width: 52px; height: 52px; border-radius: 16px; position: relative; flex: none; display: grid; place-items: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; color: #fff; }
  .avatar { justify-items: start; align-items: start; padding: 9px 0 0 10px; }
  .avatar .dot { position: absolute; right: -8px; bottom: -8px; box-shadow: 0 0 0 3px var(--surface); }
  .avatar .dot.preto { box-shadow: 0 0 0 2px var(--preto-ring), 0 0 0 4px var(--surface); }
  .p-body { flex: 1; min-width: 0; }
  .p-body b { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 600; display: block; }
  .p-cat { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
  .p-cat i { width: 8px; height: 8px; border-radius: 2px; display: block; }
  .p-loc { font-size: 11.5px; color: var(--text-3); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
  .follow { flex: none; height: 32px; padding: 0 14px; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-weight: 700; font-size: 12.5px; display: grid; place-items: center; }
  .follow.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }

  /* Configurações LGPD */
  .settings { flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .s-head { display: flex; align-items: center; gap: 10px; padding: 6px 18px 4px; }
  .s-head h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; }
  .group h3 { font-family: 'Space Mono', monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 0 2px 7px; }
  .rows { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 14px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-bottom: 1px solid var(--line-soft); }
  .row:last-child { border-bottom: 0; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { font-size: 13.5px; font-weight: 600; display: block; }
  .row .txt span { font-size: 11.5px; color: var(--text-3); line-height: 1.35; display: block; margin-top: 1px; }
  .row .txt .law { display: inline-block; }
  .law { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: .04em; color: var(--brand-text); border: 1px solid color-mix(in srgb, var(--brand) 40%, var(--line)); border-radius: 5px; padding: 2px 5px; white-space: nowrap; margin-top: 4px; display: inline-block; }
  .law.sens { color: var(--c-vermelho); border-color: color-mix(in srgb, var(--c-vermelho) 45%, var(--line)); }
  .switch { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-2); }
  .switch.on { background: var(--brand); }
  .switch.on::after { left: 21px; background: var(--on-brand); }
  .row .val { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
  .danger b { color: var(--c-vermelho); }
  .pbd { display: flex; gap: 9px; align-items: flex-start; font-size: 11.5px; color: var(--text-2); background: color-mix(in srgb, var(--c-verde) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c-verde) 30%, var(--line-soft)); border-radius: 12px; padding: 10px 12px; line-height: 1.4; }
  .pbd svg { color: var(--c-verde); }

  /* Legenda de categorias */
  .legend { width: 390px; background: #17120D; border-radius: 24px; padding: 20px; box-shadow: 0 0 0 1px #2B2217; }
  .legend h4 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .legend p { font-size: 12px; color: #8C7E69; margin-bottom: 14px; }
  .lg-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #2E2619; }
  .lg-row .dot { --glyph-on-dot: #17120D; }
  .lg-row b { font-size: 13.5px; font-weight: 600; flex: 1; }
  .lg-row b small { display: block; font-weight: 400; font-size: 11.5px; color: #8C7E69; }
  .lg-row code { font-family: 'Space Mono', monospace; font-size: 10.5px; color: #BDAE97; }
  .lg-row .light-sw { width: 18px; height: 18px; border-radius: 5px; border: 1px solid #3A3024; }

  /* Navegação inferior */
  .tabbar { flex: none; height: 82px; padding: 10px 26px 26px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line-soft); background: color-mix(in srgb, var(--bg) 92%, #000); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text-3); width: 52px; }
  .tab.on { color: var(--brand-text); }
  .tab.new { width: 46px; height: 46px; border-radius: 15px; background: var(--brand); color: var(--on-brand); justify-content: center; }
  .tab.new svg { width: 22px; height: 22px; stroke-width: 2.4; }
  .fade { position: absolute; left: 0; right: 0; bottom: 82px; height: 60px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
</style>
</head>
<body>

<header class="gallery-head">
  <div>
    <img class="head-logo" src="../brand/orange-social-logo.svg" alt="Orange Social">
    <div>
    <h1><span>Orange Social</span> · primeiras telas</h1>
    <p>Protótipo estático do app mobile: Segmented Switcher dos 4 feeds, filtro de 6 eixos, cards com bolinha + glifo VSL, borda e classificação etária, e a página de configurações LGPD. Cores, contraste e tipografia seguem o <code>docs/DESIGN_SYSTEM.md</code>.</p>
    </div>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<script>
(() => {
  "use strict";

  // ---------- ícones: Lucide 0.460.0 oficial (ISC), traço 2 — DESIGN_SYSTEM.md §5 ----------
  // chave local → nome Lucide: home=house, file=file-text, alert=triangle-alert, msg=message-circle, up=trending-up, flat=minus, pin=map-pin, chevron=chevron-right, down=chevron-down, check=shield-check, trash=trash-2, back=chevron-left, sliders=sliders-vertical
  const P = {
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    compass: '<path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/><circle cx="12" cy="12" r="10"/>',

        <figure><img src="../brand/orange-social-logo.svg" width="96" height="96" alt=""><figcaption>96</figcaption></figure>
        <figure><img src="../brand/orange-social-logo.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
        <figure><img src="../brand/orange-social-mark.svg" height="32" alt=""><figcaption>32 mark</figcaption></figure>
        <figure><img src="../brand/orange-social-mark.svg" height="16" alt=""><figcaption>16 mark</figcaption></figure>
      </div>
      <div class="swatches">${["--c-verde", "--c-amarelo", "--c-azul", "--c-laranja", "--c-vermelho"].map(c => `<i style="background:var(${c})"></i>`).join("")}<i style="background:#7A7570"></i><i style="background:#FF6A2B;flex:2"></i></div>
    </div>`;

  // ---------- montagem da galeria ----------
  const SHOTS = [
    ["01-post-feed", "Post Feed · tema escuro", "post", ""],
    ["02-audio-feed", "Audio Feed", "audio", ""],
    ["03-alert-feed", "Alert Feed", "alert", ""],
    ["04-profile-feed", "Profile Feed", "profile", ""],
    ["05-config-lgpd", "Configurações LGPD", "settings", ""],
    ["06-post-feed-claro", "Post Feed · tema claro", "post", "light"]
  ];
  const g = document.getElementById("gallery");
  g.innerHTML = SHOTS.map(([id, label, scr, theme]) =>
    `<div><p class="shot-label">${label}</p><div class="phone ${theme}" data-shot="${id}">${SCREENS[scr]()}</div></div>`).join("")
    + `<div><p class="shot-label">Legenda</p>${legend()}</div>`
    + `<div><p class="shot-label">Marca</p>${brandPanel()}</div>`;
})();
</script>
