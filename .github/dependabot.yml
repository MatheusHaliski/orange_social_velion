# Atualizações automáticas de dependências — card OS-04.
# Spring Boot 4.0 perde suporte OSS em 12/2026 e a 4.1 em 07/2027 (ADR-01):
# as PRs semanais do Dependabot são o mecanismo para não ficar para trás.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*"]
      testcontainers:
        patterns: ["org.testcontainers*"]
      jackson:
        patterns: ["com.fasterxml.jackson*", "tools.jackson*"]
    labels: ["dependencies", "backend"]

  # App web (frontend/, npm workspaces). Next e React andam juntos; Playwright fica fixado (Chromium do ambiente).
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      testes:
        patterns: ["vitest", "@testing-library/*", "jsdom", "@axe-core/playwright"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright-core"
      - dependency-name: "lucide-react"   # 0.460.0 fixado no DESIGN_SYSTEM.md §7
    labels: ["dependencies", "frontend"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: ["dependencies", "infra"]
