# CI do Orange Social (card OS-04)
#
# build-and-test  → mvn verify (unitários + *IT com Testcontainers) em JDK 21 e 25
# sbom            → CycloneDX gerado pelo parent do Spring Boot (META-INF/sbom), publicado como artefato
# secrets         → Gitleaks no histórico do push/PR
# dependencies    → Trivy (CVEs em dependências e configuração)
# image           → imagem OCI via Jib + Trivy na imagem
# rf-docs         → diagramas por RF: estrutura, desatualização em relação ao código e sintaxe Mermaid
#
# Configurações do repositório (não deste arquivo) — ver docs/TRELLO_BACKLOG.md (OS-04):
#   Settings → Advanced Security: Code scanning ativo (CodeQL + SARIF do Trivy), Secret scanning +
#   Push protection, Dependabot alerts; Branches: proteção de `main` exigindo estes checks.
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]   # 21 = mínimo suportado; 25 LTS = alvo de produção (ADR-01)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Testcontainers reuse off (runner efêmero)
        run: echo "testcontainers.reuse.enable=false" > ~/.testcontainers.properties

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 14

      - name: SBOM (CycloneDX gerado pelo spring-boot-starter-parent no package)
        if: matrix.java == '25'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 90

  rf-docs:
    name: Docs por RF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Estrutura dos documentos de RF
        run: python3 scripts/check_rf_docs.py
      - name: Diagramas atualizados junto com o código
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Sem commit base comparável (branch nova ou force-push); verificação de desatualização ignorada."
            exit 0
          fi
          python3 scripts/check_rf_docs.py --base "$BASE"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe Mermaid (renderiza todos os diagramas de docs/)
        run: |
          echo '{"args":["--no-sandbox"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/mmd
          fail=0
          for f in $(git ls-files 'docs/*.md'); do
            grep -q '```mermaid' "$f" || continue
            if npx -y @mermaid-js/mermaid-cli@11.4.2 -q -p /tmp/puppeteer.json -i "$f" -o "/tmp/mmd/$(basename "$f")"; then
              echo "ok  $f"
            else
              echo "::error file=$f::diagrama Mermaid inválido"
              fail=1
            fi
          done
          exit $fail

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Trivy (dependências e config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          # Sem isto o SARIF (e o exit-code) incluem todas as severidades
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
      - name: SARIF como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 30
      - name: Publicar SARIF no Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image:
    name: Imagem OCI (Jib) + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build da imagem no daemon local (sem push)
        run: mvn -B -ntp -DskipTests package jib:dockerBuild -Dimage=orange-social:ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orange-social:ci
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - name: SARIF como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30
      - name: Publicar SARIF no Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
